[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consispace"
version = "0.1.0"
description = "Geometry-consistent memory and UC-SSRL for Qwen3-VL"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3", "transformers==4.57.1", "peft>=0.17,<0.19",
  "accelerate>=1.10,<2", "Pillow>=10", "numpy>=1.26,<2", "safetensors>=0.4",
]

[project.optional-dependencies]
geometry = ["vggt @ git+https://github.com/facebookresearch/vggt.git", "torchvision>=0.20,<1"]
distributed = ["deepspeed>=0.16,<0.19", "flash-attn>=2.7,<3"]
retrieval = ["faiss-cpu>=1.8"]
eval-data = ["pyarrow>=15"]

[project.scripts]
consispace-train = "consispace.train:main"
consispace-predict = "consispace.predict:main"
consispace-extract = "consispace.extract:main"
consispace-evaluate = "consispace.evaluate:main"

[tool.setuptools.packages.find]
include = ["consispace*"]
